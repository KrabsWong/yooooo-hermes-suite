services:
  caddy:
    image: caddy:2.11.2-alpine
    container_name: hermes-caddy
    depends_on:
      - hermes-webui
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../proxy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - hermes-net

volumes:
  caddy-data:
  caddy-config:
